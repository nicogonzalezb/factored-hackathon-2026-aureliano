[project]
name = "lbank"
version = "0.1.0"
description = "Factored AI & Data Hackathon 2026 - LATAM Bank data pipeline"
requires-python = ">=3.11"
dependencies = [
  "boto3>=1.34",
  "duckdb>=1.1",
  "polars>=1.0",
  "pyarrow>=15",
  "pyyaml>=6",
]

[project.optional-dependencies]
analysis = ["jupyterlab>=4", "pandas>=2", "matplotlib>=3.8"]
dev = ["pytest>=8", "ruff>=0.6", "dvc>=3.50"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lbank"]

[tool.ruff]
line-length = 120
