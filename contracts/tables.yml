# Data contracts derived from "LATAM Bank Complete Data Dictionary" v1.0.0
# Each table: primary key, NOT NULL columns, enum domains, numeric ranges,
# foreign keys, the timestamp used for dedup ordering / late-arrival checks.
# Enums are checked as "warn" (schema evolution may add values); PK / NOT NULL
# are "error". Adjust severities once you have seen the real data.

version: 1.0.0

tables:

  customers:
    kind: dimension
    partition: monthly_snapshot
    expected_rows: 150000
    pk: [customer_id]
    order_by: last_updated
    not_null: [customer_id, document_number, document_type, first_name, last_name,
               date_of_birth, city, state, country, segment, registration_date,
               registration_branch_id, customer_status, last_updated, accepts_marketing]
    unique: [document_number]
    enums:
      document_type: [DNI, CURP, CC, CE, Passport]
      gender: [M, F, O]
      country: [Mexico, Colombia, Argentina]
      detected_accent: [mexican, colombian, argentine, neutral]
      segment: [Premium, Plus, Basic, Student]
      customer_status: [Active, Inactive, Suspended, Closed]
    ranges:
      credit_score: [300, 850]
    fks:
      registration_branch_id: branches.branch_id

  products:
    kind: dimension
    partition: monthly_snapshot
    expected_rows: 400000
    pk: [product_id]
    order_by: last_updated
    not_null: [product_id, customer_id, product_type, product_number, currency,
               current_balance, opening_date, opening_branch_id, product_status,
               opening_channel, has_linked_app, last_updated]
    unique: [product_number]
    enums:
      currency: [MXN, COP, ARS, USD]
      product_status: [Active, Blocked, Closed, Suspended]
      opening_channel: [Branch, Web, App, Call Center]
    fks:
      customer_id: customers.customer_id
      opening_branch_id: branches.branch_id

  branches:
    kind: dimension
    partition: full_snapshot
    expected_rows: 350
    pk: [branch_id]
    not_null: [branch_id, branch_code, branch_name, branch_type, address, city, state,
               country, geographic_zone, phone, opening_time, closing_time, has_atms,
               has_teller_windows, branch_opening_date, branch_status]
    unique: [branch_code]
    enums:
      branch_type: [Main, Express, Premium, Corporate]
      geographic_zone: [Urban, Suburban, Rural]
      branch_status: [Active, Temporarily Closed, Closed]

  service_agents:
    kind: dimension
    partition: monthly_snapshot
    expected_rows: 1200
    pk: [agent_id]
    not_null: [agent_id, employee_code, first_name, last_name, email, native_accent,
               country_of_origin, agent_type, experience_level, languages, hire_date,
               agent_status, work_shift]
    unique: [employee_code]
    enums:
      native_accent: [mexican, colombian, argentine]
      agent_type: [Phone, In-Person, Digital, Hybrid]
      experience_level: [Junior, Mid-Senior, Senior, Specialist]
      agent_status: [Active, Vacation, Leave, Inactive]
      work_shift: [Morning, Afternoon, Night, Rotating]
    ranges:
      avg_csat: [1, 5]
    fks:
      assigned_branch_id: branches.branch_id

  marketing_campaigns:
    kind: dimension
    partition: full_snapshot
    expected_rows: 200
    pk: [campaign_id]
    not_null: [campaign_id, campaign_name, campaign_type, campaign_objective,
               start_date, end_date, campaign_status]
    enums:
      campaign_type: [Email, SMS, Push, WhatsApp, Voice, Mix]
      campaign_objective: [Acquisition, Retention, Cross-sell, Up-sell, Reactivation]
      campaign_status: [Planned, Active, Paused, Completed]

  transactions:
    kind: fact
    partition: daily
    expected_rows: 5000000
    pk: [transaction_id]
    event_ts: transaction_date
    order_by: process_date
    not_null: [transaction_id, transaction_date, process_date, product_id, customer_id,
               transaction_type, amount, currency, channel, transaction_country,
               transaction_status, is_fraud]
    enums:
      transaction_type: [Deposit, Withdrawal, Transfer, Payment, Purchase, Adjustment]
      transaction_category: [Food, Transport, Services, Entertainment, Health, Other]
      currency: [MXN, COP, ARS, USD]
      channel: [ATM, Branch, Web, App, POS, Transfer]
      transaction_status: [Approved, Declined, Pending, Reversed]
    ranges:
      fraud_score: [0, 100]
    fks:
      customer_id: customers.customer_id
      product_id: products.product_id
      branch_id: branches.branch_id

  call_center_interactions:
    kind: fact
    partition: daily
    expected_rows: 800000
    pk: [interaction_id]
    event_ts: interaction_date
    order_by: process_date
    not_null: [interaction_id, interaction_date, process_date, customer_id,
               interaction_type, channel, contact_reason, reason_category,
               requires_followup, was_escalated, has_transcript, has_recording]
    enums:
      interaction_type: [Inbound Call, Outbound Call, Chat, Email, Video]
      channel: [Phone, Web Chat, WhatsApp, Email, App]
      reason_category: [Transactional, Product, Technical, Commercial, Complaint]
      detected_sentiment: [Positive, Neutral, Negative, Very Negative]
    ranges:
      sentiment_score: [-1, 1]
      duration_seconds: [0, null]
      wait_time_seconds: [0, null]
    fks:
      customer_id: customers.customer_id
      agent_id: service_agents.agent_id

  call_transcripts:
    kind: fact
    partition: daily
    expected_rows: 200000
    pk: [transcript_id]
    order_by: process_date
    not_null: [transcript_id, interaction_id, process_date, customer_id, agent_id,
               full_text, detected_language, transcription_model, duration_seconds]
    enums:
      audio_quality: [High, Medium, Low]
    ranges:
      accent_confidence: [0, 1]
    fks:
      interaction_id: call_center_interactions.interaction_id
      customer_id: customers.customer_id
      agent_id: service_agents.agent_id

  satisfaction_surveys:
    kind: fact
    partition: daily
    expected_rows: 250000
    pk: [survey_id]
    event_ts: survey_date
    order_by: process_date
    not_null: [survey_id, survey_date, process_date, customer_id, survey_type,
               send_channel, main_score]
    enums:
      survey_type: [CSAT, NPS, CES]
      send_channel: [Email, SMS, IVR, App, Web]
      nps_category: [Promoter, Passive, Detractor]
    ranges:
      main_score: [0, 10]
    fks:
      interaction_id: call_center_interactions.interaction_id
      customer_id: customers.customer_id
      agent_id: service_agents.agent_id

  digital_events:
    kind: fact
    partition: daily
    expected_rows: 10000000
    pk: [event_id]
    event_ts: event_date
    order_by: process_date
    not_null: [event_id, event_date, process_date, session_id, event_type,
               event_category, channel, is_mobile]
    enums:
      event_type: [PageView, Click, FormSubmit, Login, Logout, Error, Purchase]
      event_category: [Navigation, Transaction, Authentication, Product]
      channel: [Android App, iOS App, Desktop Web, Mobile Web]
    fks:
      customer_id: customers.customer_id
      product_id: products.product_id

  complaints:
    kind: fact
    partition: daily
    expected_rows: 80000
    pk: [complaint_id]
    event_ts: creation_date
    order_by: process_date
    not_null: [complaint_id, creation_date, process_date, customer_id, case_type,
               category, reception_channel, description, priority, status,
               sla_breached, is_repeat_complainer]
    enums:
      case_type: [Complaint, Claim, Request, Suggestion]
      reception_channel: [Call Center, Email, Web, App, Branch, Regulator]
      priority: [Low, Medium, High, Critical]
      status: [Open, In Process, Escalated, Resolved, Closed, Rejected]
    ranges:
      resolution_satisfaction: [1, 5]
    fks:
      customer_id: customers.customer_id
      affected_product_id: products.product_id
      related_branch_id: branches.branch_id
      origin_interaction_id: call_center_interactions.interaction_id
      assigned_agent_id: service_agents.agent_id

  campaign_sends:
    kind: fact
    partition: daily
    expected_rows: 2000000
    pk: [send_id]
    event_ts: send_date
    order_by: process_date
    not_null: [send_id, send_date, process_date, campaign_id, customer_id, send_channel,
               send_status, was_delivered, had_conversion]
    enums:
      send_channel: [Email, SMS, Push, WhatsApp, Voice]
      send_status: [Sent, Failed, Bounced, Blocked]
    fks:
      campaign_id: marketing_campaigns.campaign_id
      customer_id: customers.customer_id

  daily_exchange_rates:
    kind: reference
    partition: daily
    expected_rows: 3000
    pk: [date, source_currency, target_currency]
    not_null: [date, source_currency, target_currency, exchange_rate]
